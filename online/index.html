<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>P.Q.P. — Pra Quem Pode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .felt-bg {
      background: radial-gradient(ellipse at 50% 15%, #1fa147 0%, #167a34 50%, #0d4a1f 85%, #082d13 100%);
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.45);
    }
    .comic-blue-bg {
      background-color: #0088FF;
      background-image: radial-gradient(#0066CC 15%, transparent 15%);
      background-position: 0 0;
      background-size: 22px 22px;
    }
    .btn-3d {
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      box-shadow: 0 6px 0 #000;
    }
    .btn-3d:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #000;
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #000;
    }
    .btn-comic-pill {
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }
    .btn-comic-pill:active:not(:disabled) {
      transform: scale(0.97);
    }
    /* Fontes limpas e nítidas sem serrilhado */
    .title-crisp {
      color: #FFFFFF;
      font-weight: 900;
      letter-spacing: -0.02em;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.45));
    }
    .title-comic-blue {
      color: #003388;
      font-weight: 900;
      letter-spacing: -0.01em;
    }
    .card-shadow {
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.9), 0 10px 20px rgba(0, 0, 0, 0.25);
    }
    .card-shadow-lg {
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.95), 0 15px 30px rgba(0, 0, 0, 0.35);
    }
    .card-comic-doodle {
      position: relative;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(0, 40, 100, 0.25);
    }
    .card-comic-doodle::before {
      content: '';
      position: absolute;
      inset: -5px;
      border: 3px solid #000;
      border-radius: 32px;
      transform: rotate(-1.5deg);
      pointer-events: none;
      z-index: -1;
    }
    /* Scrollbar estilizada */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }
    @keyframes pulse-urgent {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .animate-urgent {
      animation: pulse-urgent 0.8s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
