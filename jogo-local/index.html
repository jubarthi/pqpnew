
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P.Q.P. – Pra Quem Pode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        body {
            font-family: 'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b3818;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .felt-bg {
            background: radial-gradient(ellipse at 50% 15%, #1fa147 0%, #167a34 50%, #0d4a1f 85%, #082d13 100%);
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.45);
        }
        .btn-3d {
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            box-shadow: 0 6px 0 #000;
        }
        .btn-3d:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #000;
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #000;
        }
        .text-comic {
            -webkit-text-stroke: 2.5px #000;
            text-shadow: 3px 3px 0px #000;
        }
        .text-comic-sm {
            -webkit-text-stroke: 1.5px #000;
            text-shadow: 2px 2px 0px #000;
        }
        .card-shadow {
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.9), 0 10px 20px rgba(0, 0, 0, 0.25);
        }
        .card-shadow-lg {
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.95), 0 15px 30px rgba(0, 0, 0, 0.35);
        }
        .speech-bubble {
            position: relative;
            background: #fff;
            border: 4px solid #000;
            box-shadow: 0 6px 0 #000;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            left: 40px;
            bottom: -18px;
            border-width: 18px 14px 0 14px;
            border-style: solid;
            border-color: #000 transparent transparent transparent;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            left: 43px;
            bottom: -12px;
            border-width: 14px 11px 0 11px;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
            z-index: 1;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 999px;
        }
        @keyframes pulse-urgent {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .animate-urgent {
            animation: pulse-urgent 0.8s ease-in-out infinite;
        }
    </style>
<script type="importmap">

</html>
